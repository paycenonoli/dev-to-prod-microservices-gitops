apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-staging
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/paycenonoli/dev-to-prod-microservices-gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/paycenonoli/dev-to-prod-microservices-gitops.git
      targetRevision: main
      path: helm/frontend
      helm:
        valueFiles:
          - $values/environments/staging/frontend-values.yaml

    - repoURL: https://github.com/paycenonoli/dev-to-prod-microservices-gitops.git
      targetRevision: main
      path: helm/product-service
      helm:
        valueFiles:
          - $values/environments/staging/product-values.yaml

    - repoURL: https://github.com/paycenonoli/dev-to-prod-microservices-gitops.git
      targetRevision: main
      path: helm/order-service
      helm:
        valueFiles:
          - $values/environments/staging/order-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
